c_compiler:
- gcc
c_compiler_version:
- '14'
c_stdlib:
- sysroot
c_stdlib_version:
- '2.17'
channel_sources:
- conda-forge
channel_targets:
- conda-forge main
docker_image:
- quay.io/condaforge/linux-anvil-x86_64:alma9
fftw:
- '3'
fortran_compiler:
- gfortran
fortran_compiler_version:
- '14'
impi_devel:
- 2021.16.0
is_intel:
- true
libblas:
- 3.9.* *netlib
liblapack:
- 3.9.* *netlib
openmpi:
- '5'
runner_variant:
- intel_mpi
target_platform:
- linux-64
with_mpi:
- true
zip_keys:
- - c_compiler_version
  - fortran_compiler_version
- - runner_variant
  - is_intel
  - with_mpi
