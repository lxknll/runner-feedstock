{% set name = "runner" %}
{% set version = "2.0.0_20260512" %}
{% set is_intel = runner_variant.startswith('intel') %}
{% set with_mpi = runner_variant.endswith('_mpi') %}

package:
  name: {{ name }}
  version: {{ version }}

# Obtain the checksum using
# curl -sL https://gitlab.com/runner-suite/runner2/-/archive/v{{ version }}/runner2-v{{ version }}.tar.gz | sha256sum
source:
  url: https://gitlab.com/runner-suite/runner2/-/archive/{{ version }}/runner2-{{ version }}.tar.gz
  sha256: c362553ae2aaaac7acea89ae2d3cf5a210fc0992943a9b39ad43d27208e420df

build:
  number: 0
  {% if is_intel %}
  skip: true  # [not linux]
  {% else %}
  skip: true  # [win]
  {% endif %}
  {% if runner_variant == 'gnu' %}
  string: "gnu_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"
  {% elif runner_variant == 'gnu_mpi' %}
  string: "openmpi_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"
  {% elif runner_variant == 'intel' %}
  string: "mkl_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"
  {% else %}
  string: "mkl_impi_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"
  {% endif %}

requirements:
  build:
    {% if not is_intel %}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('fortran') }}
    - llvm-openmp  # [osx]
    - libgomp  # [linux]
    {% if with_mpi %}
    - openmpi-mpifort
    {% endif %}
    {% endif %}
    - cmake
    - make
    - m4
    {% if is_intel %}
    - ifx_linux-64
    {% if with_mpi %}
    - impi_rt
    {% endif %}
    {% endif %}
  host:
    {% if not is_intel %}
    - libblas
    - liblapack
    - fftw
    {% if with_mpi %}
    - openmpi
    {% endif %}
    {% endif %}
    {% if is_intel %}
    - mkl-devel
    - mkl-include
    - intel-cmplr-lib-rt
    {% if with_mpi %}
    - impi_rt
    {% endif %}
    {% endif %}
  run:
    {% if not is_intel %}
    - libblas
    - liblapack
    - fftw
    {% if with_mpi %}
    - openmpi
    {% endif %}
    {% endif %}
    {% if is_intel %}
    - mkl
    - llvm-openmp
    - intel-fortran-rt
    - intel-cmplr-lib-rt
    {% if with_mpi %}
    - impi_rt
    {% endif %}
    {% endif %}

test:
  commands:
    - RuNNer.x --version
    {% if with_mpi %}
    - RuNNer_mpi.x --version
    {% endif %}
    {% if is_intel %}
    - ldd $(which RuNNer.x) | grep -i mkl
    {% if with_mpi %}
    - ldd $(which RuNNer_mpi.x) | grep -i mkl
    {% endif %}
    {% endif %}

about:
  home: https://www.theochem2.ruhr-uni-bochum.de/tc/software/runner.html.en
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: 'RuNNer - a Neural Network code for high-dimensional systems'
  description: |
    RuNNer is a software framework for the development of Behler-Parrinello
    high-dimensional neural network potentials (HDNNPs), actively developed
    at Ruhr Universität Bochum, Germany.

    Four build variants are provided under the single package name ``runner``:

    gnu
      GCC/gfortran, OpenBLAS, serial only.  Linux and macOS.

    gnu_mpi
      GCC/gfortran, OpenBLAS, OpenMPI parallel build.  Linux and macOS.

    intel
      Intel ifx, MKL, serial only.  Linux x86-64 only.

    intel_mpi
      Intel ifx, MKL, Intel MPI parallel build.  Linux x86-64 only.

    Select a specific variant with a build-string glob, e.g.::

      conda install "runner=*=openmpi_*"   # GNU + OpenMPI
      conda install "runner=*=mkl_impi_*"  # Intel + Intel MPI
  doc_url: https://runner-suite.gitlab.io/runner2
  dev_url: https://gitlab.com/runner-suite/runner2

extra:
  recipe-maintainers:
    - Theochem2RUB
    - gunnar1987
    - lxknll
    - M0M097
    - jan-janssen
