{% set name = "runner" %}
{% set version = "2.0.0_20260512" %}

package:
  name: {{ name }}
  version: {{ version }}

# Obtain the checksum using
# curl -sL https://gitlab.com/runner-suite/runner2/-/archive/v{{ version }}/runner2-v{{ version }}.tar.gz | sha256sum
source:
  url: https://gitlab.com/runner-suite/runner2/-/archive/{{ version }}/runner2-{{ version }}.tar.gz
  sha256: c362553ae2aaaac7acea89ae2d3cf5a210fc0992943a9b39ad43d27208e420df

build:
  number: 0
  {% if runner_variant == 'intel' %}
  # Intel variant: Linux x86-64 only; built in the mpich cell to avoid
  # generating duplicate packages across the MPI variant axis.
  skip: true  # [not linux or mpi != 'mpich']
  {% else %}
  skip: true  # [win]
  {% endif %}
  string: "{% if runner_variant == 'intel' %}mkl{% else %}{{ mpi }}{% endif %}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"
  script: "{% if runner_variant == 'intel' %}build_intel.sh{% else %}build_gnu.sh{% endif %}"

requirements:
  build:
    - {{ compiler('c') }}       # [runner_variant == 'gnu']
    - {{ stdlib('c') }}         # [runner_variant == 'gnu']
    - {{ compiler('fortran') }} # [runner_variant == 'gnu']
    - cmake
    - make
    - m4
    - llvm-openmp    # [osx and runner_variant == 'gnu']
    - libgomp        # [linux and runner_variant == 'gnu']
    - {{ mpi }}-mpifort  # [runner_variant == 'gnu']
    - ifx_linux-64   # [runner_variant == 'intel']
  host:
    - libblas             # [runner_variant == 'gnu']
    - liblapack           # [runner_variant == 'gnu']
    - fftw                # [runner_variant == 'gnu']
    - {{ mpi }}           # [runner_variant == 'gnu']
    - mkl-devel           # [runner_variant == 'intel']
    - mkl-include         # [runner_variant == 'intel']
    - intel-cmplr-lib-rt  # [runner_variant == 'intel']
  run:
    - libblas             # [runner_variant == 'gnu']
    - liblapack           # [runner_variant == 'gnu']
    - fftw                # [runner_variant == 'gnu']
    - {{ mpi }}           # [runner_variant == 'gnu']
    - mkl                 # [runner_variant == 'intel']
    - llvm-openmp         # [runner_variant == 'intel']
    - intel-fortran-rt    # [runner_variant == 'intel']
    - intel-cmplr-lib-rt  # [runner_variant == 'intel']

test:
  commands:
    - RuNNer.x --version
    - RuNNer_mpi.x --version               # [runner_variant == 'gnu']
    - ldd $(which RuNNer.x) | grep -i mkl  # [runner_variant == 'intel']

about:
  home: https://www.theochem2.ruhr-uni-bochum.de/tc/software/runner.html.en
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: 'RuNNer - a Neural Network code for high-dimensional systems'
  description: |
    RuNNer is a software framework for the development of Behler-Parrinello
    high-dimensional neural network potentials (HDNNPs), actively developed
    at Ruhr Universität Bochum, Germany.

    Two build variants are provided under the single package name ``runner``:

    runner [runner_variant=gnu]
      Compiled with GCC/gfortran, linked against OpenBLAS via the conda-forge
      libblas abstraction layer.  Provides both the serial executable
      (RuNNer.x) and the MPI-parallel executable (RuNNer_mpi.x).  Available
      on Linux and macOS (x86-64 and ARM64).

    runner [runner_variant=intel]
      Compiled with Intel ifx and linked against Intel MKL for maximum
      throughput on Intel CPUs.  Provides the serial executable (RuNNer.x)
      only; MPI support is not yet available in this variant.  Linux x86-64
      only.

    To select the Intel variant explicitly::

      conda install "runner=*=mkl_*"

    To select the GNU/OpenBLAS variant explicitly::

      conda install "runner=*=mpich_*"   # or openmpi_*
  doc_url: https://runner-suite.gitlab.io/runner2
  dev_url: https://gitlab.com/runner-suite/runner2

extra:
  recipe-maintainers:
    - Theochem2RUB
    - gunnar1987
    - lxknll
    - M0M097
    - jan-janssen
